<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1b4332" />
      <stop offset="100%" stop-color="#52b788" />
    </linearGradient>
    <linearGradient id="vibeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#ff6b00" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background subtle shadow/glow indicator (Optional, keep transparent) -->

  <!-- Logo Group -->
  <g transform="translate(0, 0)">
    <!-- Adventure Compass Ring -->
    <circle cx="50" cy="50" r="38" fill="none" stroke="url(#vibeGrad)" stroke-width="2.5" stroke-dasharray="6 3" opacity="0.85" />
    
    <!-- Outer Cardinal points -->
    <polygon points="50,6 53,13 47,13" fill="#ff6b00" />
    <polygon points="50,94 53,87 47,87" fill="#00f0ff" />
    <polygon points="94,50 87,53 87,47" fill="#ff6b00" />
    <polygon points="6,50 13,53 13,47" fill="#00f0ff" />

    <!-- Organic Eco Leaf (Central shape) -->
    <!-- Curved premium leaf path -->
    <path d="M50,15 C72,35 78,65 50,85 C22,65 28,35 50,15 Z" fill="url(#leafGrad)" />
    
    <!-- Leaf Center Stem (translucent teal cut) -->
    <path d="M50,85 C46,65 47,35 50,15 C53,35 54,65 50,85 Z" fill="#00f0ff" opacity="0.25" />
    
    <!-- Leaf veins (Teal glow details) -->
    <path d="M50,70 Q62,60 67,61 M50,55 Q65,42 70,44 M50,40 Q62,28 65,30" fill="none" stroke="#00f0ff" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
    <path d="M50,70 Q38,60 33,61 M50,55 Q35,42 30,44 M50,40 Q38,28 35,30" fill="none" stroke="#ff6b00" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />

    <!-- Vibrant Adventure Vibe Sun/Sparkle in top right -->
    <circle cx="68" cy="30" r="7" fill="url(#vibeGrad)" filter="url(#glow)" />
    <path d="M68,18 L68,42 M56,30 L80,30" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.9" />
  </g>
</svg>
